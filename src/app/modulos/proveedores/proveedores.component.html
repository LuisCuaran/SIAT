<h3>Proveedores</h3>
<button class="btn btn-success" (click)="mostrar(1)">Registrar</button><br><br>

<!-- Formulario -->
<div id="formulario" *ngIf="verf">
    <div class="row">
        <div class="col-lg-6">
            <input type="text" class="form-control" placeholder="Nombre" [(ngModel)]="user.nombre">
            <span style="color: red;" *ngIf="!validnombre">Nombre requerido</span>
        </div>
        <div class="col-lg-6">
            <input type="text" class="form-control" placeholder="Dirección" [(ngModel)]="user.direccion">
            <span style="color: red;" *ngIf="!validdireccion">Dirección requerida</span>
        </div>
    </div>
    <div class="row">
        <div class="col-lg-6">
            <input type="text" class="form-control" placeholder="Teléfono" [(ngModel)]="user.telefono">
            <span style="color: red;" *ngIf="!validtelefono">Teléfono requerido</span>
        </div>
        <div class="col-lg-6">
            <input type="text" class="form-control" placeholder="Email" [(ngModel)]="user.email">
            <span style="color: red;" *ngIf="!validemail">Email requerido</span>
        </div>
    </div>
    <div class="row mt-3">
        <div class="col-lg-3">
            <button class="btn btn-success" (click)="ingresar()">
                {{ beditar ? "Actualizar" : "Guardar" }}
            </button>
        </div>
        <div class="col-lg-3">
            <button class="btn btn-secondary" (click)="mostrar(0)">Cancelar</button>
        </div>
    </div>
</div>

<!-- Tabla de proveedores -->
<div class="table-responsive">
    <table class="table table-success table-striped-columns">
        <thead>
            <tr>
                <th>Nombre</th>
                <th>Dirección</th>
                <th>Teléfono</th>
                <th>Email</th>
                <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of proveedores">
                <td>{{ item.nombre }}</td>
                <td>{{ item.direccion }}</td>
                <td>{{ item.telefono }}</td>
                <td>{{ item.email }}</td>
                <td>
                    <!-- Botón de editar -->
                    <a (click)="cargardatos(item, item.id_cliente)">
                        <span class="fas fa-edit editar" title="Editar"></span>
                    </a>
                    <!-- Botón de eliminar -->
                    <a (click)="pregunta(item.id_cliente, item.nombre)">
                        <span class="fas fa-trash-alt eliminar" title="Eliminar"></span>
                    </a>
                </td>
            </tr>
        </tbody>
    </table>
</div>
