<h3>Ventas</h3>
<button class="btn btn-primary" (click)="mostrar(1)">Insertar Venta</button><br><br>

<!-- Formulario -->
<div id="formulario" *ngIf="verf">
    <div class="row">
        <div class="col-lg-6">
            <input type="date" [(ngModel)]="venta.fecha" class="form-control" placeholder="Fecha">
        </div>
        <div class="col-lg-6">
            <input type="number" [(ngModel)]="venta.total" class="form-control" placeholder="Total">
        </div>
    </div>
    <div class="row">
        <div class="col-lg-6">
            <input type="text" [(ngModel)]="venta.fo_cliente" class="form-control" placeholder="ID Cliente">
        </div>
    </div>
    <br>
    <div class="row">
        <div class="col-lg-4">
            <button class="btn btn-success" (click)="ingresar()" *ngIf="!beditar">Guardar</button>
        </div>
        <div class="col-lg-4">
            <button class="btn btn-warning" (click)="editar()" *ngIf="beditar">Actualizar</button>
        </div>
        <div class="col-lg-4">
            <button class="btn btn-secondary" (click)="mostrar(0)">Cancelar</button>
        </div>
    </div>
</div>

<!-- Tabla de Ventas -->
<div class="table-responsive">
    <table class="table table-striped">
        <thead>
            <tr>
                <th>Fecha</th>
                <th>Total</th>
                <th>ID Cliente</th>
                <th>Opciones</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let item of ventas">
                <td>{{ item.fecha }}</td>
                <td>{{ item.total }}</td>
                <td>{{ item.fo_cliente }}</td>
                <td>
                    <div class="dropdown">
                        <button class="btn btn-primary btn-sm dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                            Opciones
                        </button>
                        <ul class="dropdown-menu">
                            <li>
                                <a class="dropdown-item editar-opcion" (click)="cargarDatos(item, item.id_ventas)">Editar</a>
                            </li>
                            <li>
                                <a class="dropdown-item eliminar-opcion" (click)="pregunta(item.id_ventas)">Eliminar</a>
                            </li>
                        </ul>
                    </div>
                </td>
                
                
            </tr>
        </tbody>
    </table>
</div>
